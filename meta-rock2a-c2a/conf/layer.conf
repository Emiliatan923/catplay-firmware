# Layer metadata for the RADXA ROCK 2A CatPlay firmware.
#
# The board itself is supported by meta-rockchip (branch scarthgap-vendor):
# machine `rockchip-rk3528-rock-2a`, vendor kernel `linux-rockchip` 6.1 and the
# Rockchip BSP u-boot. This layer carries only what the CatPlay dongle adds on
# top of that BSP, plus the workarounds the vendor layer needs to build on a
# modern host.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rock2a-c2a"
BBFILE_PATTERN_rock2a-c2a = "^${LAYERDIR}/"
BBFILE_PRIORITY_rock2a-c2a = "10"

LAYERSERIES_COMPAT_rock2a-c2a = "scarthgap"
