# AIC8800 USB combo on the ROCK 2A (USB id a69c:8d81).
#
# The Rockchip 6.1 vendor kernel already carries all three drivers in-tree:
#   drivers/net/wireless/aic/aic8800_usb/{aic_load_fw,aic8800_fdrv}
#   drivers/bluetooth/aic_btusb.c
#
# arch/arm64/configs/rockchip_linux_defconfig already enables the WiFi pair:
#   CONFIG_AIC_LOADFW_SUPPORT=m
#   CONFIG_AIC8800_WLAN_SUPPORT=m
#   CONFIG_AIC_WLAN_AIC8800_USB=y
# but NOT the Bluetooth HCI driver, so without this fragment there is no hci0
# and wireless CarPlay cannot pair.
CONFIG_BT_AIC_BTUSB=m
