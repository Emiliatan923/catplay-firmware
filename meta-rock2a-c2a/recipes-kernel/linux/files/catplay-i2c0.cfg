# CatPlay kernel options that the vendor
# arch/arm64/configs/rockchip_linux_defconfig does not already provide.
#
# Keep this fragment self-contained: a fragment that only sets CONFIG_BT=y
# silently drops CONFIG_BT_AIC_BTUSB (the Bluetooth HCI driver this board
# needs), because the option depends on the BT symbol being selected *in the
# same Kconfig pass*. That regression surfaces late, as an image build failure:
#
#   nothing provides kernel-module-aic-btusb needed by aic8800-usb-modprobe
#
# so every option the dongle relies on is asserted here explicitly.

# Bluetooth stack plus the AIC8800 USB HCI driver (-> hci0).
CONFIG_BT=y
CONFIG_BT_AIC_BTUSB=m

# AIC8800 USB WiFi (-> wlan0). Already in the vendor defconfig, repeated so a
# fragment change cannot drop it.
CONFIG_AIC_LOADFW_SUPPORT=m
CONFIG_AIC8800_WLAN_SUPPORT=m
CONFIG_AIC_WLAN_AIC8800_USB=y

# i2c0 carries the MFi authentication chip (header pins 3/5).
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_RK3X=y

# USB net: the CarPlay NCM data link, host side.
#
# rockchip_linux_defconfig sets CONFIG_USB_NET_DRIVERS=y but leaves
# CONFIG_USB_USBNET unset, so the whole usbnet subtree below it is invisible in
# Kconfig. The cooked .config then contains no CDCETHER/CDC_NCM line at all --
# not even "# ... is not set" -- which is the fingerprint of a hidden symbol
# rather than a disabled one:
#
#     $ grep -E 'CDCETHER|CDC_NCM' .config
#     (nothing)
#
# The live effect is that g_iphone's accessory probe cannot hand the dongle's
# NCM interface to its host driver, so the role switch never completes:
#
#     iap2_acc_probe_accessory: notified match usb 003:002 iap2_if=0 ncm_if=1 data_if=2
#     usb 3-1:1.1: iap2_acc_probe_accessory: ensure_driver_bound(cdc_ncm) failed -19
#     iPhone: role-switch accessory probe failed: -19
#     iPhone: status -> roleswitchfailed
#     ERROR catplay_iap2_usb_host::carplay_phone_gadget: Entered error state:
#       Accessory failed to appear after the role switch within a reasonable timeout
#
# -19 is ENODEV from driver_find() in iap2_scan.c: request_module("cdc_ncm")
# cannot conjure a driver the kernel was never built with. iap2_scan.c also
# includes <linux/usb/cdc_ncm.h> and <linux/usb/usbnet.h> unconditionally, so
# the driver sources have to exist in the tree regardless.
#
# CONFIG_USB_USBNET is the gate; USB_NET_CDC_NCM selects USB_NET_CDCETHER.
# USB_USBNET selects MII, which is already =y.
#
# Matches the Armbian card that carried this link successfully -- its
# /boot/config-6.1.115-vendor-rk35xx has USB_USBNET/CDCETHER/CDC_NCM all =y,
# and its kern.log records the working handoff this fragment restores:
#
#     cdc_ncm 3-1:1.1 eth0: register 'cdc_ncm' at usb-xhci-hcd.4.auto-1, CDC NCM (NO ZLP), ...
#     iap2_char 3-1:1.0: iap2_acc_probe_accessory: drivers bound iap2_if=0 ncm_if=1
#
# Note this is the HOST driver only. The board never builds an NCM *gadget*
# function for this link, so CONFIG_USB_CONFIGFS_NCM stays unset on purpose.
CONFIG_USB_USBNET=y
CONFIG_USB_NET_CDC_NCM=y
