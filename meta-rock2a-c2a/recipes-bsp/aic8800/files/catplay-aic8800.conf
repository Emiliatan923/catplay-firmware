# AIC8800 USB combo on the ROCK 2A.
#
# These come from the Rockchip 6.1 vendor kernel's in-tree drivers, not from an
# out-of-tree recipe:
#   drivers/net/wireless/aic/aic8800_usb/aic_load_fw
#   drivers/net/wireless/aic/aic8800_usb/aic8800_fdrv
#   drivers/bluetooth/aic_btusb.c        (enabled by catplay-aic8800.cfg)
#
# Order matters: aic8800_fdrv needs the firmware loader to have loaded the
# firmware into the chip first, otherwise the interface never appears.
aic_load_fw
aic8800_fdrv
aic_btusb
