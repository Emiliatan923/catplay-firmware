debug = false

[platform]
kind = "rock2a"
state_dir = "/var/lib/catplay"

[usb.car]
enabled = true
# RADXA ROCK 2A UDC (rk3528 vendor kernel). The 0x51 handshake has to flip this
# port to host, which dwc3 only allows in otg mode, so the DTB must set
# dr_mode = "otg" -- the vendor rk3528 DTSI already does.
udc = "fe500000.dwc3"
power_mode = "car-vbus-single-cable"
pinned = false

[mfi]
selftest = true

[mfi.i2c]
# Header pins 3/5 = I2C0_SDA_M1 / I2C0_SCL_M1 -> /dev/i2c-0.
# The MFi chip does not answer i2cdetect; use
# `catplay_c2a --mfi-self-test-count N` as the authoritative presence check.
device = "/dev/i2c-0"
address = 0x10
timeout_ms = 2000
retry_delay_ms = 5

# Wireless CarPlay. bluetooth and wifi must be enabled together (or both
# disabled): the wireless gadget needs the AP and the iAP2 Bluetooth profile.
#
# `device` is the interface AirPlay/Bonjour are bound to, and it must be the AP
# interface -- the AirPlay server binds TCP and advertises Bonjour *per
# interface*, so naming wlan0 here would advertise the service on the upstream
# network where the iPhone cannot see it.
#
# ssid/password must match /etc/catplay/hostapd.conf exactly; the daemon hands
# these values to the iPhone over iAP2.
[wifi]
enabled = true
device = "ap0"
country = "CN"
ssid = "CatPlay_Rock"
password = "catplay1234"
wpa = true
channel = 36

[bluetooth]
enabled = true
# The aic8800 USB combo comes up as hci0. This name is both the BlueZ adapter
# alias and the AirPlay display name, so it is what the iPhone lists under
# Settings -> General -> CarPlay.
device = "hci0"
name = "CatPlay_Rock"
