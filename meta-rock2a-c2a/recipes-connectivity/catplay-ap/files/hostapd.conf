# hostapd configuration for the CatPlay wireless-CarPlay access point.
#
# Mirrors the vendor firmware template for this exact chip (the AIC8800D80
# profile in the CarLinkIt build, catplay-firmware/meta-carlinkit
# HOSTAPD_ULTRA), minus its BMW/CarLinkIt-specific vendor elements.
#
# Two entries are not cosmetic:
#   * assocresp_elements with the FMS bit -- AirPlay discovery is mDNS
#     multicast, and iOS expects the AP to advertise Flexible Multicast
#     Service.
#   * beacon_int=25 with dtim_period=1 -- aggressive beaconing and no DTIM
#     batching, so multicast wakes clients promptly.

interface=ap0
driver=nl80211

# 5 GHz. Channel 36 is non-DFS, so no radar detection delay at startup.
hw_mode=a
channel=36

ieee80211n=1
ieee80211ac=1
ieee80211ax=1
vht_oper_chwidth=0
he_oper_chwidth=0
wmm_enabled=1

country_code=CN
ieee80211d=1

ssid=CatPlay_Rock
ignore_broadcast_ssid=0

# WPA2-PSK/CCMP. iOS will complain that the network has no internet access --
# that is expected and harmless: CarPlay runs over the local link only.
wpa=2
wpa_passphrase=catplay1234
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
auth_algs=1

# Keep associated-but-idle phones around without dropping the session.
ap_max_inactivity=10
beacon_int=25
dtim_period=1

# Extended capabilities: FMS (bit 7 of the first octet).
assocresp_elements=7f0400000080

ctrl_interface=/run/hostapd
ctrl_interface_group=0
